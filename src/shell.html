<style>

<header class="bar"><div class="bar-in">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M13 4.5 L16.2 13 L13 21.5 L9.8 13 Z" fill="var(--accent)"/><circle cx="13" cy="13" r="2" fill="var(--bg)"/></svg><span class="t">GCC Compass</span></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-advisor" data-act="tab" data-tab="advisor" aria-selected="true">Setup Advisor</button>
    <button class="tab" role="tab" id="tab-explorer" data-act="tab" data-tab="explorer" aria-selected="false">GCC Explorer</button>
    <button class="tab" role="tab" id="tab-compare" data-act="tab" data-tab="compare" aria-selected="false">City Compare</button>
    <button class="tab" role="tab" id="tab-signals" data-act="tab" data-tab="signals" aria-selected="false">Signals feed</button>
    <button class="tab" role="tab" id="tab-trust" data-act="tab" data-tab="trust" aria-selected="false">Data &amp; trust</button>
  </nav>
  <button class="iconbtn" data-act="theme" type="button">Switch theme</button>
</div></header>

<main class="wrap">
  <div class="lede" id="lede">
    <div><h1>Where should your GCC go, and what will it cost?</h1><p style="margin-top:8px">Ranked cities, year-1 cost net of state incentives, peers and providers for a new centre in India.</p></div>
  </div>

  <section class="panel-tab" id="advisor">
    <div class="adv">
      <aside class="inputs card" aria-label="Your requirement">
        <label class="f" for="req-text">Describe what you need
          <textarea id="req-text" rows="5" placeholder="Size, industry, timeline and priorities of the centre"></textarea></label>
        <div class="row" style="gap:8px"><button class="btn" id="btn-run" type="button">Find cities</button></div>
        <div class="chips" id="examples" aria-label="Example requirements"></div>
        <div class="understood" id="understood" aria-live="polite"></div>
        <div class="fields">
          <label class="f" for="f-hc">Headcount, year 1<input type="number" id="f-hc" min="10" max="5000" step="10"></label>
          <label class="f" for="f-months">Go-live (months)<input type="number" id="f-months" min="1" max="36"></label>
          <label class="f" for="f-ind">Industry<select id="f-ind"></select></label>
          <label class="f" for="f-pri">Priority<select id="f-pri"><option value="balanced">Balanced</option><option value="cost">Lowest cost</option><option value="depth">Talent depth</option></select></label>
          <label class="f" for="f-mix-swe">Engineering %<input type="number" id="f-mix-swe" min="0" max="100"></label>
          <label class="f" for="f-mix-ds">Data &amp; AI %<input type="number" id="f-mix-ds" min="0" max="100"></label>
          <label class="f" for="f-mix-fin">Finance &amp; ops %<input type="number" id="f-mix-fin" min="0" max="100"></label>
          <label class="f" for="f-g2000" style="flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:8px"><input type="checkbox" id="f-g2000" style="width:auto"> Parent is Fortune 1000 / Forbes 2000</label>
        </div>
        <div><div class="eyebrow" style="margin-bottom:6px">Providers you need</div><div class="chips" id="needs"></div></div>
        <details><summary>Cost assumptions</summary>
          <div class="assump">
            <label class="f" for="a-ramp">Avg staff paid in yr 1 (%)<input type="number" id="a-ramp" step="5"></label>
            <label class="f" for="a-load">Pay load (PF, bonus)<input type="number" id="a-load" step="0.01"></label>
            <label class="f" for="a-band">Pay band ± (%)<input type="number" id="a-band" step="1"></label>
            <label class="f" for="a-sqft">Sq ft per seat<input type="number" id="a-sqft" step="5"></label>
            <label class="f" for="a-fitLow">Fit-out low, ₹/sq ft<input type="number" id="a-fitLow" step="100"></label>
            <label class="f" for="a-fitHigh">Fit-out high, ₹/sq ft<input type="number" id="a-fitHigh" step="100"></label>
            <label class="f" for="a-recLow">Recruitment low (%)<input type="number" id="a-recLow" step="0.5"></label>
            <label class="f" for="a-recHigh">Recruitment high (%)<input type="number" id="a-recHigh" step="0.5"></label>
            <label class="f" for="a-entLow">Set-up low, ₹ lakh<input type="number" id="a-entLow" step="5"></label>
            <label class="f" for="a-entHigh">Set-up high, ₹ lakh<input type="number" id="a-entHigh" step="5"></label>
          </div>
        </details>
      </aside>
      <div id="results" aria-live="polite"></div>
    </div>
  </section>
  <section class="panel-tab" id="explorer" hidden></section>
  <section class="panel-tab" id="compare" hidden></section>
  <section class="panel-tab" id="signals" hidden></section>
  <section class="panel-tab" id="trust" hidden></section>

</main>
